<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Mithaas &amp; Co. — Diwali mithai, halwai since 1961">
  <defs>
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#180a07"/>
      <stop offset="0.55" stop-color="#110605"/>
      <stop offset="1" stop-color="#0b0403"/>
    </linearGradient>

    <radialGradient id="glow" cx="50%" cy="58%" r="52%">
      <stop offset="0" stop-color="#d9a54a" stop-opacity="0.34"/>
      <stop offset="0.55" stop-color="#8a5a1c" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#110605" stop-opacity="0"/>
    </radialGradient>

    <!-- the one gold gradient, its highlight sliding sideways for ever -->
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#8a5a1c"/>
      <stop offset="0.18" stop-color="#d9a54a"/>
      <stop offset="0.34" stop-color="#f6cf7a"/>
      <stop offset="0.44" stop-color="#fff3cf"/>
      <stop offset="0.56" stop-color="#f6cf7a"/>
      <stop offset="0.74" stop-color="#c08a3a"/>
      <stop offset="1" stop-color="#8a5a1c"/>
      <animateTransform attributeName="gradientTransform" type="translate"
        values="-1 0; 1 0; -1 0" dur="9s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="ribbon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5d0d16"/>
      <stop offset="0.35" stop-color="#9e1b25"/>
      <stop offset="0.5" stop-color="#c9343f"/>
      <stop offset="0.65" stop-color="#9e1b25"/>
      <stop offset="1" stop-color="#5d0d16"/>
    </linearGradient>

    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="softer" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>

    <clipPath id="frame"><rect width="1200" height="340" rx="0"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="340" fill="url(#ink)"/>

    <!-- breathing diya light -->
    <ellipse cx="600" cy="250" rx="420" ry="200" fill="url(#glow)">
      <animate attributeName="opacity" values="0.55;1;0.55" dur="6.5s" repeatCount="indefinite"/>
      <animate attributeName="rx" values="400;450;400" dur="6.5s" repeatCount="indefinite"/>
    </ellipse>

    <!-- the wordmark -->
    <text x="600" y="150" text-anchor="middle" fill="url(#gold)"
          font-family="'Yatra One','Noto Sans Devanagari','Nirmala UI','Mangal',serif"
          font-size="86" letter-spacing="2">मिठास</text>

    <text x="600" y="188" text-anchor="middle" fill="#f6ead6" opacity="0.92"
          font-family="Georgia,'Times New Roman',serif" font-size="27" letter-spacing="11">
      MITHAAS &amp; CO.
    </text>

    <!-- the rule that draws itself, then the eyebrow -->
    <line x1="600" y1="212" x2="600" y2="212" stroke="#d9a54a" stroke-width="1.2" stroke-opacity="0.75">
      <animate attributeName="x1" values="600;470;470" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="600;730;730" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0;0.9;0.9" dur="4s" repeatCount="indefinite"/>
    </line>

    <text x="600" y="246" text-anchor="middle" fill="#f6ead6" opacity="0.55"
          font-family="Verdana,Geneva,sans-serif" font-size="11" letter-spacing="5.5">
      HALWAI SINCE 1961 · CHANDNI CHOWK, DELHI
    </text>
    <text x="600" y="272" text-anchor="middle" fill="#f6cf7a" opacity="0.9"
          font-family="Georgia,'Times New Roman',serif" font-style="italic" font-size="17">
      Open something sweet this Diwali.
    </text>

    <!-- liquid drips, the Motion Prompt #019 gesture, in gold -->
    <g fill="url(#gold)" opacity="0.9">
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 -60; 0 340" dur="5.2s" repeatCount="indefinite"/>
        <circle cx="196" cy="0" r="7">
          <animate attributeName="opacity" values="0;0.9;0.9;0" dur="5.2s" repeatCount="indefinite"/>
        </circle>
        <ellipse cx="196" cy="-26" rx="7" ry="16" filter="url(#soft)">
          <animate attributeName="opacity" values="0.55;0.9;0.75;0" dur="5.2s" repeatCount="indefinite"/>
        </ellipse>
      </g>
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 -90; 0 360" dur="6.8s" begin="1.4s" repeatCount="indefinite"/>
        <circle cx="1010" cy="0" r="5.5">
          <animate attributeName="opacity" values="0;0.8;0.8;0" dur="6.8s" begin="1.4s" repeatCount="indefinite"/>
        </circle>
        <ellipse cx="1010" cy="-22" rx="5.5" ry="13" filter="url(#soft)">
          <animate attributeName="opacity" values="0.4;0.8;0.6;0" dur="6.8s" begin="1.4s" repeatCount="indefinite"/>
        </ellipse>
      </g>
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 -40; 0 330" dur="4.4s" begin="2.6s" repeatCount="indefinite"/>
        <circle cx="330" cy="0" r="3.4">
          <animate attributeName="opacity" values="0;0.7;0.7;0" dur="4.4s" begin="2.6s" repeatCount="indefinite"/>
        </circle>
      </g>
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 -70; 0 350" dur="7.4s" begin="0.8s" repeatCount="indefinite"/>
        <circle cx="880" cy="0" r="3">
          <animate attributeName="opacity" values="0;0.6;0.6;0" dur="7.4s" begin="0.8s" repeatCount="indefinite"/>
        </circle>
      </g>
    </g>

    <!-- the red silk ribbon edge, sliding -->
    <rect x="0" y="326" width="1200" height="3" fill="url(#ribbon)" opacity="0.9">
      <animate attributeName="opacity" values="0.55;1;0.55" dur="7s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
